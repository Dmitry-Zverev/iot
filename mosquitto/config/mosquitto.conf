# ============================================================
#  Mosquitto 2.x — конфигурация MQTT-брокера
#  Файл монтируется в контейнер как /mosquitto/config/mosquitto.conf
# ============================================================

# --- Слушатель 1: обычный MQTT (ESP32, Node-RED, MQTT Explorer) ---
listener 1883
protocol mqtt

# --- Слушатель 2: MQTT поверх WebSocket (клиенты в браузере) ---
# В IoT.txt порт 9001 был проброшен, но слушателя не было — порт висел впустую.
listener 9001
protocol websockets

# --- Аутентификация ---
# Mosquitto 2.x по умолчанию анонимов НЕ пускает. Оставляем так:
# брокер доступен из локальной сети, поэтому пароль обязателен.
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Хранение ---
# Retained-сообщения и сессии переживают перезапуск контейнера
persistence true
persistence_location /mosquitto/data/

# --- Логи ---
# stdout, чтобы читалось через `docker compose logs mosquitto`
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# --- Лимиты (защита от случайного флуда кривой прошивкой) ---
max_queued_messages 1000
message_size_limit 65536
